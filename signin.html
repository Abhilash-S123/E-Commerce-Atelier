<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <section class="container fluid ">
        <div class="row section">
            <div class="col-md-4 main ">
                <div class="centering">
                    <p class="heading">ANTLIER</p>
                </div>
                <div class="centering sub-heading">Sign in to your account</div>


                <div class="list-group" id="list-tab" role="tablist">
                    <div class="btn-centering">


                        <div class="centering">
                            <a class="list-group-item-action active button" id="signin-btn" data-bs-toggle="list"
                                href="#list-home" role="tab" aria-controls="list-home">Sign in</a>
                        </div>
                        <div class="centering">
                            <a class="list-group-item-action button" id="list-settings-list" data-bs-toggle="list"
                                href="#list-settings" role="tab" aria-controls="list-settings">Create account</a>
                        </div>
                    </div>

<div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="list-home" role="tabpanel"
                        aria-labelledby="list-home-list">
                        <label for="">Email Address</label>
                        <input type="text">
                        <label class="password" for="">password</label>
                        <input type="password">
                    </div>
                    <div class="tab-pane fade" id="list-settings" role="tabpanel" aria-labelledby="list-settings-list">
                        <div class="centering">
                        <input placeholder="Last name" type="text">
                        </div>
                        
                        <input placeholder="Email" type="text">
                        <input placeholder="Password" type="text">
                    </div>
                </div>

                </div>



                




            </div>
        </div>

    </section>
    <script src="signin.js"></script>
</body>

</html>
